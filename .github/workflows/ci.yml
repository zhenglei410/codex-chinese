name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Build (unix)
        if: runner.os != 'Windows'
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/codex-chinese .

      - name: Build (windows)
        if: runner.os == 'Windows'
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/codex-chinese.exe .
        shell: bash

      - name: Version smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/codex-chinese.exe -version
          else
            ./dist/codex-chinese -version
          fi
