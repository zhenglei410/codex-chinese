name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Prelude regression tests
        run: node test/prelude.test.mjs

      - name: Build Windows artifacts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:VERSION = "ci"
          .\build.ps1

      - name: Build Unix artifacts
        if: runner.os != 'Windows'
        run: VERSION=ci bash build.sh

      - name: Version smoke test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\dist\codex-chinese-windows-amd64.exe -version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Version smoke test (Unix)
        if: runner.os != 'Windows'
        run: ./dist/codex-chinese-$(go env GOOS)-$(go env GOARCH) -version
