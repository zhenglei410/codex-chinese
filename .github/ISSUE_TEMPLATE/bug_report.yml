name: Bug 报告
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先运行 `codex-chinese -doctor` 并把输出贴在这里，能大幅加快定位。
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 23H2 / macOS 14.5 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex 版本
      placeholder: 设置 → 关于 里的版本号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 完全退出 Codex
        2. 运行 codex-chinese
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果（含报错输出）
    validations:
      required: true
