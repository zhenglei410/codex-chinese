name: Bug 报告
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先运行：

        ```powershell
        codex-chinese.exe -doctor
        codex-chinese.exe -verify
        powershell -NoProfile -ExecutionPolicy Bypass -File scripts\diagnose_windows.ps1
        ```

        请勿粘贴 API Key、令牌、对话内容或其他敏感信息。
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 23H2 / macOS 14.5 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex 版本
      placeholder: 设置 → 关于 里的版本号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 scripts\ai_deploy.ps1
        2. 启动托盘或重启 Codex
        3. 运行 codex-chinese.exe -verify
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果（含 -verify 输出和日志）
    validations:
      required: true
